<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的任務小窩</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <span class="eyebrow">🍑 小任務日記</span>
    <h1 class="login-title">我的任務小窩</h1>
    <div class="field">
      <span>帳號</span>
      <input type="email" id="login-email" placeholder="you@example.com" autocomplete="username">
    </div>
    <div class="field">
      <span>密碼</span>
      <input type="password" id="login-password" placeholder="請輸入密碼" autocomplete="current-password">
    </div>
    <div class="login-error hidden" id="loginError"></div>
    <button type="button" class="btn-solid login-submit" id="loginSubmitBtn">登入</button>
  </div>
</div>
<div class="app hidden" id="appRoot">
  <div class="grain"></div>
  <header class="topbar">
    <div class="brand">
      <span class="eyebrow">🍑 小任務日記</span>
      <h1>我的任務小窩</h1>
    </div>
    <div class="controls">
      <div class="view-toggle" id="viewToggle">
        <button class="vt-btn active" data-view="kanban">清單</button>
        <button class="vt-btn" data-view="calendar">行事曆</button>
        <button class="vt-btn" data-view="notes">筆記</button>
      </div>
      <button class="btn-mini" id="exportBtn" title="匯出備份檔">📤 匯出</button>
      <button class="btn-mini" id="importBtn" title="匯入備份檔">📥 匯入</button>
      <input type="file" id="importFileInput" accept="application/json,.json" style="display:none">
      <button class="btn-mini" id="logoutBtn" title="登出">🔒 登出</button>
      <button class="btn-add" id="openAddBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新增任務
      </button>
    </div>
  </header>

  <div class="stats-strip" id="statsStrip"></div>

  <div class="filter-strip" id="filterStrip"></div>

  <!-- CHECKLIST VIEW -->
  <main class="view" id="kanbanView">
    <div class="month-toolbar">
      <button class="cal-nav" id="checklistMonthPrev" aria-label="上一月">‹</button>
      <div class="month-toolbar-label" id="checklistMonthLabel">—</div>
      <button class="cal-nav" id="checklistMonthNext" aria-label="下一月">›</button>
      <button class="cal-today" id="checklistMonthThis">本月</button>
    </div>
    <div class="checklist-container" id="checklistContainer"></div>
  </main>

  <!-- CALENDAR VIEW -->
  <main class="view hidden" id="calendarView">
    <div class="cal-toolbar">
      <button class="cal-nav" id="prevMonth" aria-label="上一月">‹</button>
      <div class="cal-title" id="calTitle">—</div>
      <button class="cal-nav" id="nextMonth" aria-label="下一月">›</button>
      <button class="cal-today" id="todayBtn">今天</button>
    </div>
    <div class="cal-weekdays">
      <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </main>

  <!-- NOTES VIEW -->
  <main class="view hidden" id="notesView">
    <div class="month-toolbar">
      <button class="cal-nav" id="notesMonthPrev" aria-label="上一月">‹</button>
      <div class="month-toolbar-label" id="notesMonthLabel">全部月份</div>
      <button class="cal-nav" id="notesMonthNext" aria-label="下一月">›</button>
      <button class="cal-today" id="notesMonthThis">本月</button>
      <button class="cal-today" id="notesMonthAll">全部</button>
    </div>
    <div class="note-composer">
      <div class="note-composer-row">
        <select id="note-category"></select>
        <button class="btn-add small" id="addNoteBtn">+ 新增筆記</button>
      </div>
      <textarea id="note-content" rows="3" placeholder="記錄你遇到的問題、下次需要修改或注意的事項..."></textarea>
    </div>
    <div class="notes-list" id="notesList"></div>
  </main>

  <!-- DAY DETAIL PANEL -->
  <div class="day-panel" id="dayPanel">
    <div class="day-panel-head">
      <span class="eyebrow" id="dayPanelDate">—</span>
      <button class="icon-btn" id="closeDayPanel">✕</button>
    </div>
    <div class="day-panel-list" id="dayPanelList"></div>
    <button class="btn-add small" id="dayPanelAdd">+ 在此日新增任務</button>
  </div>

  <!-- STATS LIST PANEL（完成／逾期清單） -->
  <div class="day-panel stats-panel" id="statsPanel">
    <div class="day-panel-head">
      <div>
        <span class="eyebrow" id="statsPanelEyebrow">—</span>
        <h3 class="stats-panel-title" id="statsPanelTitle">—</h3>
      </div>
      <button class="icon-btn" id="closeStatsPanel">✕</button>
    </div>
    <div class="day-panel-list" id="statsPanelList"></div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal">
      <div class="modal-head">
        <span class="eyebrow" id="modalEyebrow">NEW TASK</span>
        <h3 id="modalTitle">新增任務</h3>
      </div>
      <form id="taskForm">
        <label class="field">
          <span>標題</span>
          <input type="text" id="f-title" required placeholder="例如：完成季度報告">
        </label>
        <label class="field">
          <span>說明</span>
          <textarea id="f-desc" rows="3" placeholder="補充細節（選填）"></textarea>
        </label>
        <div class="field-row">
          <label class="field">
            <span>狀態</span>
            <select id="f-status">
              <option value="todo">待辦</option>
              <option value="doing">進行中</option>
              <option value="done">已完成</option>
            </select>
          </label>
          <label class="field">
            <span>優先度</span>
            <select id="f-priority">
              <option value="low">低</option>
              <option value="medium" selected>中</option>
              <option value="high">高</option>
            </select>
          </label>
        </div>
        <label class="field">
          <span>專案分類</span>
          <select id="f-category">
            <option value="perf">績效考核</option>
            <option value="promo">升遷制度</option>
            <option value="payroll">薪資計算</option>
            <option value="medical">臨場醫護</option>
            <option value="urgent">突發任務</option>
            <option value="routine">扣繳申報資料</option>
            <option value="labor">勞動契約</option>
            <option value="general">例行公事</option>
            <option value="onboarding">新進追蹤</option>
          </select>
        </label>
        <label class="field">
          <span>截止日期</span>
          <input type="date" id="f-due">
        </label>
        <div class="modal-actions">
          <button type="button" class="btn-ghost" id="deleteTaskBtn">刪除</button>
          <div class="modal-actions-right">
            <button type="button" class="btn-ghost" id="cancelModalBtn">取消</button>
            <button type="button" class="btn-solid" id="saveTaskBtn">儲存</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="confirm-overlay hidden" id="confirmOverlay">
    <div class="confirm-box">
      <p id="confirmMessage">確定要執行這個動作嗎？</p>
      <div class="confirm-actions">
        <button class="btn-ghost" id="confirmCancelBtn">取消</button>
        <button class="btn-solid" id="confirmOkBtn">確定</button>
      </div>
    </div>
  </div>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');

:root{
  --bg: #FFF6EC;
  --panel: #FFFFFF;
  --panel-2: #FFF1E4;
  --grid-line: #FFE1CC;
  --ink: #6B4A45;
  --ink-dim: #B79A8E;
  --ink-faint: #D8BFB2;
  --amber: #FFC15E;
  --teal: #6FC6B4;
  --rose: #FF8FA3;
  --green: #8FD694;
  --coral: #FF9B85;
  --lavender: #C9AEE8;
  --cat-perf: #C9AEE8;
  --cat-promo: #FFC15E;
  --cat-payroll: #6FC6B4;
  --cat-medical: #FF8FA3;
  --cat-urgent: #FF7A5C;
  --cat-routine: #8FB8E8;
  --cat-labor: #C9A66B;
  --cat-general: #A8C8B0;
  --cat-onboarding: #8E9AE8;
  --font-display: 'Baloo 2', 'Quicksand', ui-rounded, sans-serif;
  --font-body: 'Nunito', -apple-system, sans-serif;
}

*{box-sizing:border-box;}
.app{
  position:relative;
  font-family: var(--font-body);
  color: var(--ink);
  background:
    radial-gradient(circle at 8% 12%, rgba(255,196,163,0.35) 0, transparent 40%),
    radial-gradient(circle at 92% 8%, rgba(201,174,232,0.3) 0, transparent 38%),
    radial-gradient(circle at 85% 90%, rgba(143,214,148,0.25) 0, transparent 40%),
    radial-gradient(circle at 10% 88%, rgba(255,193,94,0.28) 0, transparent 40%),
    var(--bg);
  min-height: 100%;
  padding: 28px 32px 60px;
}
.grain{ display:none; }

.eyebrow{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.04em;
  color: var(--coral);
  text-transform: none;
  display:block;
  margin-bottom: 4px;
}

.topbar{
  display:flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 16px;
  border-bottom: 3px dashed var(--grid-line);
  padding-bottom: 18px;
  margin-bottom: 18px;
}
.brand h1{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 30px;
  margin: 0;
  color: var(--ink);
  letter-spacing: 0.01em;
}
.controls{ display:flex; align-items:center; gap: 12px; }

.view-toggle{
  display:flex;
  border: 2px solid var(--grid-line);
  border-radius: 999px;
  overflow:hidden;
  background: var(--panel);
  padding: 3px;
}
.vt-btn{
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 13px;
  padding: 8px 18px;
  background: transparent;
  border:none;
  border-radius: 999px;
  color: var(--ink-dim);
  cursor:pointer;
  transition: all .18s ease;
}
.vt-btn.active{ background: var(--coral); color: #fff; box-shadow: 0 3px 8px rgba(255,155,133,0.4); }
.vt-btn:hover:not(.active){ color: var(--ink); }

.btn-add{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
  display:flex; align-items:center; gap:6px;
  padding: 11px 18px;
  background: var(--coral);
  color: #fff;
  border:none;
  border-radius: 999px;
  cursor:pointer;
  box-shadow: 0 4px 0 #E67F68;
  transition: transform .12s ease, box-shadow .12s ease;
}
.btn-add:hover{ transform: translateY(-2px); }
.btn-add:active{ transform: translateY(1px); box-shadow: 0 2px 0 #E67F68; }
.btn-add.small{ font-size:12.5px; padding:9px 14px; width: 100%; justify-content:center; margin-top: 10px; box-shadow: 0 3px 0 #E67F68; }

.btn-mini{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 12px;
  padding: 9px 14px;
  background: var(--panel);
  border: 2px solid var(--grid-line);
  color: var(--ink-dim);
  border-radius: 999px;
  cursor: pointer;
  transition: all .15s ease;
}
.btn-mini:hover{ border-color: var(--coral); color: var(--coral); }

.confirm-overlay{
  position:fixed; inset:0; background: rgba(107,74,69,0.35);
  display:flex; align-items:center; justify-content:center; z-index: 55;
  backdrop-filter: blur(2px);
}
.confirm-overlay.hidden{ display:none; }
.confirm-box{
  background: var(--panel); border:3px solid var(--grid-line); border-radius: 20px;
  width: 320px; max-width: 88vw; padding: 22px 22px 18px;
  box-shadow: 0 10px 0 rgba(255,225,204,0.6);
}
.confirm-box p{ font-size:14px; line-height:1.6; color: var(--ink); margin: 0 0 18px; font-weight:600; }
.confirm-actions{ display:flex; justify-content:flex-end; gap:10px; }

.stats-strip{
  display:flex; gap: 14px; margin-bottom: 22px; flex-wrap:wrap;
}
.stat-chip{
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 12.5px;
  color: var(--ink-dim);
  display:flex; align-items:center; gap:6px;
  background: var(--panel);
  border: 2px solid var(--grid-line);
  padding: 7px 14px;
  border-radius: 999px;
}
.stat-chip b{ color: var(--ink); font-size: 14px; }
.stat-dot{ width:8px; height:8px; border-radius:50%; }
button.stat-chip{ cursor:pointer; transition: all .15s ease; }
.stat-chip.clickable:hover{ border-color: var(--coral); color: var(--ink); transform: translateY(-1px); }
.stat-chip.clickable.active{ border-color: var(--coral); background: #FFF0EA; color: var(--ink); }
.stats-panel{ width: 380px; right: -400px; }
.stats-panel-title{ font-family: var(--font-display); font-size:18px; margin:0; color: var(--ink); }
.stats-panel .task-card{ cursor:pointer; }
.sp-dates{ display:flex; flex-wrap:wrap; gap:6px; }
.sp-date{
  font-family: var(--font-display); font-weight:700; font-size:11px;
  background: var(--panel); color: var(--ink-dim); border-radius:999px; padding:2px 9px;
}
.sp-date.done{ color:#5FA868; background: rgba(143,214,148,0.22); }
.sp-date.overdue{ color:#fff; background: var(--rose); }
.stats-panel .task-card.done .sp-date{ opacity: 1; }

.filter-strip{ display:flex; gap:8px; margin-bottom: 20px; flex-wrap:wrap; }
.filter-strip.hidden{ display:none; }
.filter-chip{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 12px;
  display:flex; align-items:center; gap:6px;
  background: var(--panel);
  border: 2px solid var(--grid-line);
  color: var(--ink-dim);
  padding: 6px 13px;
  border-radius: 999px;
  cursor:pointer;
  transition: all .15s ease;
}
.filter-chip .fc-dot{ width:8px; height:8px; border-radius:50%; }
.filter-chip:hover{ border-color: var(--coral); color: var(--ink); }
.filter-chip.active{ background: var(--ink); border-color: var(--ink); color: #fff; }
.filter-chip.active .fc-dot{ box-shadow: 0 0 0 2px rgba(255,255,255,0.4); }

.cat-badge{
  display:inline-block;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 10.5px;
  padding: 2px 9px;
  border-radius: 999px;
  margin-bottom: 7px;
  color: var(--ink);
}

.view.hidden{ display:none; }

/* KANBAN */
.board{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 18px; align-items:start; }
.column{
  background: var(--panel);
  border: 3px solid var(--grid-line);
  border-radius: 20px;
  min-height: 200px;
  display:flex; flex-direction:column;
  box-shadow: 0 6px 0 rgba(255,225,204,0.6);
}
.col-head{
  display:flex; align-items:center; gap:8px;
  padding: 14px 16px;
  border-bottom: 3px dashed var(--grid-line);
}
.col-tick{ font-family: var(--font-display); font-size: 0; line-height:1; }
.column[data-status="todo"] .col-tick::before{ content:"📝"; font-size:18px; }
.column[data-status="doing"] .col-tick::before{ content:"🌱"; font-size:18px; }
.column[data-status="done"] .col-tick::before{ content:"🎉"; font-size:18px; }
.col-head h2{ font-family: var(--font-display); font-size: 15px; margin:0; flex:1; font-weight:700; color: var(--ink); }
.col-count{
  font-family: var(--font-display);
  font-weight:700;
  font-size: 12px;
  color: var(--coral);
  background: var(--panel-2);
  border-radius: 999px;
  padding: 3px 10px;
}
.col-body{ padding: 12px; display:flex; flex-direction:column; gap:10px; flex:1; min-height: 80px; }
.col-body.drag-over{ background: rgba(255,193,94,0.12); outline: 3px dashed var(--amber); outline-offset: -6px; border-radius: 14px; }

.task-card{
  position:relative;
  background: var(--panel-2);
  border: 2px solid var(--grid-line);
  border-radius: 14px;
  padding: 13px 14px 11px;
  cursor: grab;
  transition: transform .15s ease, box-shadow .15s ease;
  box-shadow: 0 3px 0 rgba(255,225,204,0.8);
}
.task-card:hover{ border-color: var(--coral); transform: translateY(-2px) rotate(-0.4deg); box-shadow: 0 5px 10px rgba(255,155,133,0.18); }
.task-card:active{ cursor: grabbing; }
.task-card::before{ display:none; }
.task-card .t-title{ font-weight:700; font-size:14px; margin-bottom:6px; padding-right: 10px; line-height:1.4; color: var(--ink); }
.task-card.done .t-title{ text-decoration: line-through; opacity: 0.55; }
.task-card .t-desc{ font-size:12.5px; color: var(--ink-dim); margin-bottom:8px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.task-card .t-meta{ display:flex; align-items:center; gap:8px; font-family: var(--font-body); font-weight:600; font-size: 11.5px; color: var(--ink-faint); }
.pri-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; box-shadow: 0 0 0 3px rgba(0,0,0,0.03); }
.t-due{ margin-left:auto; background: var(--panel); padding: 2px 8px; border-radius: 999px; }
.t-due.overdue{ color: #fff; background: var(--rose); }
.empty-col{ font-size:12.5px; color: var(--ink-faint); text-align:center; padding: 24px 8px; font-family: var(--font-body); font-weight:600; }

/* CALENDAR */
.cal-toolbar{ display:flex; align-items:center; gap:14px; margin-bottom: 14px; }
.cal-title{ font-family: var(--font-display); font-weight:700; font-size:18px; min-width: 140px; color: var(--ink); }
.cal-nav{
  width:32px; height:32px; border-radius:50%; border:2px solid var(--grid-line);
  background: var(--panel); color: var(--coral); font-size:16px; font-weight:700; cursor:pointer;
}
.cal-nav:hover{ background: var(--coral); color:#fff; border-color: var(--coral); }
.cal-today{
  font-family: var(--font-display); font-weight:700; font-size:12px;
  border:2px solid var(--grid-line); background:var(--panel); color:var(--ink-dim);
  padding:8px 14px; border-radius:999px; cursor:pointer;
}
.cal-today:hover{ color: #fff; background: var(--coral); border-color: var(--coral); }

.cal-weekdays{
  display:grid; grid-template-columns: repeat(7,1fr);
  font-family: var(--font-display); font-weight:700; font-size:12px; color: var(--coral);
  padding: 0 2px 8px;
}
.cal-weekdays span{ text-align:center; }
.cal-weekdays span:first-child, .cal-weekdays span:last-child{ color: var(--rose); }

.cal-grid{ display:grid; grid-template-columns: repeat(7,1fr); gap:7px; }
.cal-cell{
  background: var(--panel);
  border: 2px solid var(--grid-line);
  border-radius: 14px;
  min-height: 92px;
  padding: 7px;
  cursor:pointer;
  display:flex; flex-direction:column; gap:4px;
  transition: all .12s ease;
}
.cal-cell:hover{ border-color: var(--coral); transform: translateY(-1px); }
.cal-cell.out{ opacity: 0.4; cursor:default; }
.cal-cell.out:hover{ transform:none; border-color: var(--grid-line); }
.cal-cell.today{ border-color: var(--coral); background: #FFF0EA; }
.cal-cell.drag-over{ background: rgba(255,193,94,0.15); }
.cal-daynum{ font-family: var(--font-display); font-weight:700; font-size:12.5px; color: var(--ink-dim); }
.cal-daynum.holiday{ color: var(--rose); }
.cal-cell.today .cal-daynum{ color: var(--coral); }
.holiday-label{ font-family: var(--font-body); font-weight:800; font-size:9.5px; color: var(--rose); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:-2px; }
.cal-chip{
  font-size: 10.5px; font-weight:700; padding: 2px 7px; border-radius: 999px;
  background: var(--panel-2); color: var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  border-left: 4px solid var(--ink-faint);
}
.cal-chip{ display:flex; align-items:center; gap:4px; }
.cal-chip-title{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cal-chip.done{ opacity: 0.55; }
.cal-chip.done .cal-chip-title{ text-decoration: line-through; }
.task-done-cb{
  width:13px; height:13px; flex-shrink:0; margin:0; padding:0;
  accent-color: var(--coral); cursor:pointer;
}
.cal-chip .check-date{ font-size:9.5px; padding:1px 5px; }
.t-title-row{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.t-title-row .t-title{ margin-bottom:0; flex:1; }
.t-title-row .task-done-cb{ width:17px; height:17px; }
.cal-more{ font-family: var(--font-display); font-weight:700; font-size:10px; color: var(--ink-faint); }

/* NOTES VIEW */
.month-toolbar{ display:flex; align-items:center; gap:10px; margin-bottom: 16px; }

      renderAll();
      return;

    unsubscribeSnapshot = taskDocRef.onSnapshot(
      (snap)=>{
        const data = snap.exists ? snap.data() : {};
        tasks = data.tasks || [];
        notes = data.notes || [];
        newHires = data.newHires || [];
        departures = data.departures || [];
        checklistChecks = data.checklistChecks || {};
        collapsedSections = data.collapsedSections || {};

    statsPanelMode = mode;
    // 避免兩個側欄疊在一起
    document.getElementById('dayPanel').classList.remove('open');
    dayPanelDate = null;
    renderStats();
    renderStatsPanel();
    document.getElementById('statsPanel').classList.add('open');
  }
  function closeStatsPanel(){
    statsPanelMode = null;
    document.getElementById('statsPanel').classList.remove('open');
    renderStats();
  }

  function renderStatsPanel(){
    const today = todayStr();
    let list, eyebrow, title, empty;
    if(statsPanelMode === 'done'){
      list = tasks.filter(t=>t.status==='done')
        .sort((a,b)=> (b.doneAt||0) - (a.doneAt||0) || (b.dueDate||'').localeCompare(a.dueDate||''));
      eyebrow = '✅ DONE';
      title = `已完成 ${list.length} 項`;
      empty = '— 目前還沒有完成的任務 —';
    } else {
      list = tasks.filter(t=> t.dueDate && t.dueDate < today && t.status !== 'done')
        .sort((a,b)=> a.dueDate.localeCompare(b.dueDate));
      eyebrow = '⏰ OVERDUE';
      title = `逾期 ${list.length} 項`;
      empty = '— 太棒了，沒有逾期任務 🎉 —';
    }
    document.getElementById('statsPanelEyebrow').textContent = eyebrow;
    document.getElementById('statsPanelTitle').textContent = title;
    const container = document.getElementById('statsPanelList');
    container.innerHTML = list.length ? list.map(t=>{
      const cat = t.category || 'routine';
      const isDone = t.status === 'done';
      let dateInfo = '';
      if(isDone){
        dateInfo = `
          <span class="sp-date done">完成 ${t.doneAt ? fmtTsDate(t.doneAt) : '（未記錄）'}</span>
          ${t.dueDate ? `<span class="sp-date">截止 ${fmtFullDate(t.dueDate)}</span>` : ''}`;
      } else {
        dateInfo = `
          <span class="sp-date">截止 ${fmtFullDate(t.dueDate)}</span>
          <span class="sp-date overdue">逾期 ${daysBetween(t.dueDate, today)} 天</span>`;
      }
      return `
        <div class="task-card ${isDone?'done':''}" data-id="${t.id}">
          <span class="cat-badge" style="background:${CATEGORY_COLOR[cat]}">${CATEGORY_LABEL[cat]}</span>
          <div class="t-title-row">
            <input type="checkbox" class="task-done-cb" data-id="${t.id}" ${isDone?'checked':''} title="${isDone?'取消完成':'標記為完成'}">
            <div class="t-title">${escapeHtml(t.title)}</div>
          </div>
          <div class="sp-dates">${dateInfo}</div>
        </div>`;
    }).join('') : `<div class="empty-col">${empty}</div>`;
    container.querySelectorAll('.task-card').forEach(card=>{
      card.addEventListener('click', ()=> openModal(card.dataset.id));
    });
    wireTaskDoneCheckboxes(container);
  }

  function renderFilterStrip(){
    const strip = document.getElementById('filterStrip');
    const chips = [`<button class="filter-chip ${categoryFilter==='all'?'active':''}" data-cat="all">✨ 全部</button>`];
    Object.keys(CATEGORY_LABEL).forEach(key=>{
      chips.push(`<button class="filter-chip ${categoryFilter===key?'active':''}" data-cat="${key}"><span class="fc-dot" style="background:${CATEGORY_COLOR[key]}"></span>${CATEGORY_LABEL[key]}</button>`);
    });
    strip.innerHTML = chips.join('');
    strip.querySelectorAll('.filter-chip').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        categoryFilter = btn.dataset.cat;
        renderFilterStrip();
        renderCalendar();
        renderNotes();
      });
    });

  function visibleTasks(){
    return categoryFilter === 'all' ? tasks : tasks.filter(t => t.category === categoryFilter);
  }

  function inRecordMonth(ts, rm){
    if(!rm) return true;
    if(!ts) return false;
    const d = new Date(ts);
    return d.getFullYear() === rm.y && d.getMonth() === rm.m;
  }

  function shiftRecordMonth(delta){
    if(!recordMonth){
      const now = new Date();
      recordMonth = { y: now.getFullYear(), m: now.getMonth() };
    }
    let { y, m } = recordMonth;
    m += delta;
    if(m < 0){ m = 11; y -= 1; }
    if(m > 11){ m = 0; y += 1; }
    recordMonth = { y, m };
    onRecordMonthChange();
  }

  function setRecordMonthThisMonth(){
    const now = new Date();
    recordMonth = { y: now.getFullYear(), m: now.getMonth() };
    onRecordMonthChange();
  }

  function setRecordMonthAll(){
    recordMonth = null;
    onRecordMonthChange();
  }

  function onRecordMonthChange(){
    renderMonthToolbars();
    renderNotes();
  }

  function renderMonthToolbars(){
    const label = recordMonth ? `${recordMonth.y}年${recordMonth.m+1}月` : '全部月份';
    const kL = document.getElementById('kanbanMonthLabel');
    const nL = document.getElementById('notesMonthLabel');
    if(kL) kL.textContent = label;
    if(nL) nL.textContent = label;
  }

  function renderStats(){
    const strip = document.getElementById('statsStrip');
    const total = tasks.length;
    const done = tasks.filter(t=>t.status==='done').length;
    const overdue = tasks.filter(t=> t.dueDate && t.dueDate < todayStr() && t.status !== 'done').length;
    strip.innerHTML = `
      <div class="stat-chip">總計 <b>${total}</b></div>
      <button type="button" class="stat-chip clickable ${statsPanelMode==='done'?'active':''}" data-stat="done" title="查看已完成清單"><span class="stat-dot" style="background:var(--green)"></span>完成 <b>${done}</b></button>
      <button type="button" class="stat-chip clickable ${statsPanelMode==='overdue'?'active':''}" data-stat="overdue" title="查看逾期清單"><span class="stat-dot" style="background:var(--rose)"></span>逾期 <b>${overdue}</b></button>
    `;
    strip.querySelectorAll('.stat-chip.clickable').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(statsPanelMode === btn.dataset.stat) closeStatsPanel();
        else openStatsPanel(btn.dataset.stat);
      });
    });
  }

  function fmtDue(d){
    if(!d) return '';
    const [y,m,day] = d.split('-');
    return `${m}/${day}`;
  }

  function taskCardHTML(t){
    const overdue = t.dueDate && t.dueDate < todayStr() && t.status !== 'done';
    const cat = t.category || 'routine';
    return `
      <div class="task-card" draggable="true" data-id="${t.id}">
        <span class="cat-badge" style="background:${CATEGORY_COLOR[cat]}">${CATEGORY_LABEL[cat]}</span>
        <div class="t-title">${escapeHtml(t.title)}</div>
        ${t.description ? `<div class="t-desc">${escapeHtml(t.description)}</div>` : ''}
        <div class="t-meta">

        </div>
      </div>

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ====== 月度檢核清單：渲染 ======

  function checklistSectionHTML(section){
    const items = checklistItems.filter(it=>it.section===section)
      .filter(it=> !it.months || it.months.includes(checklistMonth.m));

  // 每位人員有自己的細項清單（可編輯）；舊資料沒有 items 時，從範本轉換
  function templateItems(kind, type){
    const tpl = kind==='hire' ? NEWHIRE_TEMPLATES[type||'general'] : DEPARTURE_TEMPLATE;
    return tpl.map(text=>({ id: uid(), text }));
  }
  function ensurePersonItems(person, kind){
    if(Array.isArray(person.items)) return person.items;
    const tpl = kind==='hire' ? NEWHIRE_TEMPLATES[person.type||'general'] : DEPARTURE_TEMPLATE;
    const oldChecks = person.checks || {};
    const newChecks = {};
    person.items = tpl.map((text,i)=>{
      const id = 'i'+i;
      if(oldChecks[i]) newChecks[id] = true;
      return { id, text };
    });
    person.checks = newChecks;
    return person.items;
  }

  function personCardHTML(person, kind){
    const editingId = kind==='hire' ? editingHireId : editingDepartureId;
    const items = ensurePersonItems(person, kind);
    const checks = person.checks || {};
    const doneCount = items.filter(it=>checks[it.id]).length;
    const collapsed = !!person.collapsed;
    if(editingId === person.id){
      return `
        <div class="person-card editing" data-id="${person.id}" data-kind="${kind}">
          <input type="text" class="edit-person-name" value="${escapeHtml(person.name)}">
          ${kind==='hire' ? `
            <select class="edit-person-type">
              <option value="project" ${person.type==='project'?'selected':''}>專案</option>
              <option value="general" ${person.type==='general'?'selected':''}>一般</option>
            </select>
            <div class="month-picker-label">※ 更換類型會把細項重設為該類型的預設清單</div>` : ''}
          <div class="checklist-item-form-actions">
            <button class="btn-ghost person-edit-cancel-btn" data-id="${person.id}" data-kind="${kind}">取消</button>
            <button class="btn-solid person-edit-save-btn" data-id="${person.id}" data-kind="${kind}">儲存</button>
          </div>
        </div>
      `;
    }
    const itemRows = items.map(it=>{
      if(editingPersonItem && editingPersonItem.personId===person.id && editingPersonItem.itemId===it.id){
        return `
          <div class="check-item editing">
            <input type="text" class="edit-person-item-text" value="${escapeHtml(it.text)}">
            <div class="checklist-item-form-actions">
              <button class="btn-ghost pitem-edit-cancel-btn" type="button">取消</button>
              <button class="btn-solid pitem-edit-save-btn" type="button" data-id="${person.id}" data-kind="${kind}" data-item="${it.id}">儲存</button>
            </div>
          </div>`;
      }
      const on = !!checks[it.id];
      return `
        <label class="check-item ${on?'checked':''}">
          <input type="checkbox" class="person-check-cb" data-id="${person.id}" data-kind="${kind}" data-item="${it.id}" ${on?'checked':''}>
          <span class="check-item-text">${escapeHtml(it.text)}</span>
          ${checkedDateHTML(checks[it.id])}
          <span class="check-item-actions">
            <button class="check-item-edit-btn pitem-edit-btn" type="button" data-id="${person.id}" data-item="${it.id}" title="編輯細項">✎</button>
            <button class="check-item-del-btn pitem-del-btn" type="button" data-id="${person.id}" data-kind="${kind}" data-item="${it.id}" title="刪除細項">✕</button>
          </span>
        </label>`;
    }).join('');
    const addForm = addingPersonItemFor===person.id ? `
      <div class="checklist-item-form">
        <input type="text" class="new-person-item-text" placeholder="輸入細項名稱">
        <div class="checklist-item-form-actions">
          <button class="btn-ghost pitem-add-cancel-btn" type="button">取消</button>
          <button class="btn-solid pitem-add-save-btn" type="button" data-id="${person.id}" data-kind="${kind}">新增</button>
        </div>
      </div>` : '';
    return `
      <div class="person-card ${collapsed?'collapsed':''}" data-id="${person.id}" data-kind="${kind}">
        <div class="person-card-head">
          <button class="person-toggle-btn" type="button" data-id="${person.id}" data-kind="${kind}" title="${collapsed?'展開細項':'收起細項'}" aria-expanded="${!collapsed}">▾</button>
          <span class="person-name">${escapeHtml(person.name)}</span>
          ${kind==='hire' ? `<span class="cat-badge" style="background:${person.type==='project'?'var(--cat-urgent)':'var(--cat-onboarding)'}">${person.type==='project'?'專案':'一般'}</span>` : ''}
          <span class="checklist-progress">${doneCount}/${items.length}</span>
          <button class="person-edit-btn" type="button" data-id="${person.id}" data-kind="${kind}" title="編輯">✎</button>
          <button class="person-del-btn" type="button" data-id="${person.id}" data-kind="${kind}" title="刪除">✕</button>
        </div>
        ${collapsed ? '' : `
        <div class="checklist-items">
          ${itemRows || '<div class="empty-col">— 尚無細項 —</div>'}
        </div>
        ${addForm}
        ${addingPersonItemFor===person.id ? '' : `<button class="btn-mini pitem-add-btn" type="button" data-id="${person.id}">＋ 新增細項</button>`}
        `}
      </div>
    `;
  }

  function rosterSectionHTML(kind){

    const title = kind==='hire' ? '👏🏻&nbsp;&nbsp;新進人員' : '👋🏻&nbsp;&nbsp;離職人員';
    const addFlag = kind==='hire' ? addingHire : addingDeparture;

          ${sectionToggleHTML(kind)}

          <button class="btn-mini roster-add-btn" data-kind="${kind}">＋ 新增${kind==='hire'?'新人':'離職人員'}</button>

              <select class="new-person-type">

  function renderChecklistView(){
    const label = document.getElementById('checklistMonthLabel');
    if(label) label.textContent = `${checklistMonth.y}年${checklistMonth.m}月`;
    const container = document.getElementById('checklistContainer');
    if(!container) return;
    container.innerHTML =
      checklistSectionHTML('payroll') +
      checklistSectionHTML('medical') +
      checklistSectionHTML('other') +
      rosterSectionHTML('hire') +
      rosterSectionHTML('departure');
    wireChecklistEvents(container);
  }

  function wireChecklistEvents(container){
    container.querySelectorAll('.section-toggle-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const k = btn.dataset.sectionKey;
        collapsedSections[k] = !collapsedSections[k];
        persist();
        renderChecklistView();
      });
    });
    container.querySelectorAll('.check-item-cb').forEach(cb=>{
      cb.addEventListener('change', ()=> toggleChecklistItem(cb.dataset.id));
    });
    container.querySelectorAll('.checklist-add-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{ addingItemSection = btn.dataset.section; collapsedSections[btn.dataset.section] = false; renderChecklistView(); });
    });
    container.querySelectorAll('.item-cancel-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{ addingItemSection = null; renderChecklistView(); });
    });
    container.querySelectorAll('.item-save-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const section = btn.dataset.section;
        const form = btn.closest('.checklist-item-form');
        const text = form.querySelector('.new-item-text').value.trim();
        if(!text){ showToast('請輸入項目名稱'); return; }
        let months = null;
        if(section==='other'){
          const checked = Array.from(form.querySelectorAll('.newitem-month-cb:checked')).map(cb=>parseInt(cb.value,10));
          months = checked.length ? checked : null;
        }
        checklistItems.push({ id: uid(), section, text, months });
        addingItemSection = null;
        persist();
        renderChecklistView();
        showToast('項目已新增');
      });
    });
    container.querySelectorAll('.check-item-edit-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{ editingChecklistItemId = btn.dataset.id; renderChecklistView(); });
    });
    container.querySelectorAll('.item-edit-cancel-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{ editingChecklistItemId = null; renderChecklistView(); });
    });
    container.querySelectorAll('.item-edit-save-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.id;
        const box = btn.closest('.check-item.editing');
        const text = box.querySelector('.edit-item-text').value.trim();
        if(!text){ showToast('項目名稱不能是空的'); return; }
        const it = checklistItems.find(x=>x.id===id);
        if(it){
          it.text = text;
          if(it.section==='other'){
            const checked = Array.from(box.querySelectorAll('.edititem-month-cb:checked')).map(cb=>parseInt(cb.value,10));
            it.months = checked.length ? checked : null;
          }
        }
        editingChecklistItemId = null;
        persist();
        renderChecklistView();
        showToast('項目已更新');
      });
    });
    container.querySelectorAll('.check-item-del-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.id;
        const ok = await askConfirm('確定要刪除這個項目嗎？');
        if(!ok) return;
        checklistItems = checklistItems.filter(x=>x.id!==id);
        persist();
        renderChecklistView();
        showToast('項目已刪除');
      });
    });

    container.querySelectorAll('.roster-add-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(btn.dataset.kind==='hire') addingHire = true; else addingDeparture = true;
        collapsedSections[btn.dataset.kind] = false;
        renderChecklistView();
      });
    });
    container.querySelectorAll('.person-cancel-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(btn.dataset.kind==='hire') addingHire = false; else addingDeparture = false;
        renderChecklistView();
      });
    });
    container.querySelectorAll('.person-save-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const kind = btn.dataset.kind;
        const form = btn.closest('.checklist-item-form');
        const name = form.querySelector('.new-person-name').value.trim();
        if(!name){ showToast('請輸入姓名'); return; }
        if(kind==='hire'){
          const type = form.querySelector('.new-person-type').value;
          newHires.push({ id: uid(), name, type, createdAt: Date.now(), items: templateItems('hire', type), checks: {} });
          addingHire = false;
        } else {
          departures.push({ id: uid(), name, createdAt: Date.now(), items: templateItems('departure'), checks: {} });
          addingDeparture = false;
        }
        persist();
        renderChecklistView();
        showToast('已新增');
      });
    });
    container.querySelectorAll('.person-edit-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(btn.dataset.kind==='hire') editingHireId = btn.dataset.id; else editingDepartureId = btn.dataset.id;
        renderChecklistView();
      });
    });
    container.querySelectorAll('.person-edit-cancel-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(btn.dataset.kind==='hire') editingHireId = null; else editingDepartureId = null;
        renderChecklistView();
      });
    });
    container.querySelectorAll('.person-edit-save-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const kind = btn.dataset.kind;
        const id = btn.dataset.id;
        const box = btn.closest('.person-card.editing');
        const name = box.querySelector('.edit-person-name').value.trim();

  function renderCalendar(){
    const y = calDate.getFullYear(), m = calDate.getMonth();
    document.getElementById('calTitle').textContent = `${y}年 ${m+1}月`;
    const firstDay = new Date(y, m, 1);
    const startOffset = firstDay.getDay();
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const daysInPrevMonth = new Date(y, m, 0).getDate();
    const grid = document.getElementById('calGrid');
    let cells = [];
    for(let i=startOffset-1;i>=0;i--){
      cells.push({ day: daysInPrevMonth-i, out:true, dateStr: null });
    }
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      cells.push({ day:d, out:false, dateStr });
    }
    while(cells.length % 7 !== 0){
      cells.push({ day: cells.length, out:true, dateStr:null });
    }
    const today = todayStr();
    const pool = visibleTasks();
    grid.innerHTML = cells.map(c=>{
      if(c.out) return `<div class="cal-cell out"><span class="cal-daynum">${c.day}</span></div>`;
      const dayTasks = pool.filter(t=>t.dueDate === c.dateStr)
        .sort((a,b)=>{
          const doneDiff = (a.status==='done'?1:0) - (b.status==='done'?1:0);
          if(doneDiff !== 0) return doneDiff;
          return (PRI_ORDER[a.priority] ?? 1) - (PRI_ORDER[b.priority] ?? 1);
        });
      const isToday = c.dateStr === today;
      const shown = dayTasks.slice(0,3);
      const more = dayTasks.length - shown.length;
      const dow = new Date(c.dateStr + 'T00:00:00').getDay();
      const isWeekend = dow === 0 || dow === 6;
      const holidayName = TW_HOLIDAYS[c.dateStr];
      const isHoliday = isWeekend || !!holidayName;
      return `<div class="cal-cell ${isToday?'today':''}" data-date="${c.dateStr}">
        <span class="cal-daynum ${isHoliday?'holiday':''}">${c.day}</span>
        ${holidayName ? `<span class="holiday-label">${escapeHtml(holidayName)}</span>` : ''}
        ${shown.map(t=>`<div class="cal-chip ${t.status==='done'?'done':''}" style="border-left-color:${CATEGORY_COLOR[t.category || 'routine']}" title="${escapeHtml(t.title)}">
          <input type="checkbox" class="task-done-cb" data-id="${t.id}" ${t.status==='done'?'checked':''} title="${t.status==='done'?'取消完成':'標記為完成'}">
          ${t.status==='done' ? checkedDateHTML(t.doneAt) : ''}
          <span class="cal-chip-title">${escapeHtml(t.title)}</span>
        </div>`).join('')}
        ${more>0 ? `<span class="cal-more">+${more} 更多</span>` : ''}
      </div>`;
    }).join('');
    grid.querySelectorAll('.cal-cell:not(.out)').forEach(cell=>{
      cell.addEventListener('click', ()=> openDayPanel(cell.dataset.date));
      cell.addEventListener('dragover', e=>{ e.preventDefault(); cell.classList.add('drag-over'); });
      cell.addEventListener('dragleave', ()=> cell.classList.remove('drag-over'));
      cell.addEventListener('drop', e=>{
        e.preventDefault();
        cell.classList.remove('drag-over');
        const id = e.dataTransfer.getData('text/plain');
        const task = tasks.find(t=>t.id===id);
        if(task){ task.dueDate = cell.dataset.date; persist(); renderAll(); }
      });
    });
    wireTaskDoneCheckboxes(grid);
  }

  function wireTaskDoneCheckboxes(root){

  function toggleTaskDone(id){
    const t = tasks.find(x=>x.id===id);
    if(!t) return;
    if(t.status === 'done'){
      t.status = 'todo';
      delete t.doneAt;
      showToast('已改回待辦');
    } else {
      t.status = 'done';
      t.doneAt = Date.now();
      showToast('任務完成 🎉');
    }
    persist();
    renderAll();
  }

      titleInput.focus();

  function askConfirm(message){
    return new Promise(resolve=>{
      document.getElementById('confirmMessage').textContent = message;
      const overlay = document.getElementById('confirmOverlay');
      const okBtn = document.getElementById('confirmOkBtn');
      const cancelBtn = document.getElementById('confirmCancelBtn');
      overlay.classList.remove('hidden');
      function cleanup(result){
        overlay.classList.add('hidden');
        okBtn.removeEventListener('click', onOk);
        cancelBtn.removeEventListener('click', onCancel);
        overlay.removeEventListener('click', onOverlay);
        resolve(result);
      }
      function onOk(){ cleanup(true); }
      function onCancel(){ cleanup(false); }
      function onOverlay(e){ if(e.target === overlay) cleanup(false); }
      okBtn.addEventListener('click', onOk);
      cancelBtn.addEventListener('click', onCancel);
      overlay.addEventListener('click', onOverlay);
    });
  }

    const a = document.createElement('a');
    a.href = url;
    a.download = `任務小窩備份_${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    if(!file) return;
    try{
      const text = await file.text();
      const imported = JSON.parse(text);
      let importedTasks, importedNotes;
      if(Array.isArray(imported)){
        importedTasks = imported;
        importedNotes = [];
      } else if(imported && Array.isArray(imported.tasks)){
        importedTasks = imported.tasks;
        importedNotes = Array.isArray(imported.notes) ? imported.notes : [];
      } else {
        throw new Error('格式不正確');
      }
      const ok = await askConfirm(`這個備份檔有 ${importedTasks.length} 筆任務、${importedNotes.length} 筆筆記，匯入後會「取代」目前畫面上所有的資料，確定要繼續嗎？`);
      if(!ok) return;
      tasks = importedTasks;
      notes = importedNotes;
      await persist();
      renderAll();

  });

  document.getElementById('checklistMonthPrev').addEventListener('click', ()=>{
    let { y, m } = checklistMonth;
    m -= 1; if(m < 1){ m = 12; y -= 1; }
    checklistMonth = { y, m };
    renderChecklistView();
  });
  document.getElementById('checklistMonthNext').addEventListener('click', ()=>{
    let { y, m } = checklistMonth;
    m += 1; if(m > 12){ m = 1; y += 1; }
    checklistMonth = { y, m };
    renderChecklistView();
  });
  document.getElementById('checklistMonthThis').addEventListener('click', ()=>{
    const n = new Date();
    checklistMonth = { y: n.getFullYear(), m: n.getMonth()+1 };
    renderChecklistView();
  });
  document.getElementById('notesMonthPrev').addEventListener('click', ()=> shiftRecordMonth(-1));
  document.getElementById('notesMonthNext').addEventListener('click', ()=> shiftRecordMonth(1));
  document.getElementById('notesMonthThis').addEventListener('click', setRecordMonthThisMonth);
  document.getElementById('notesMonthAll').addEventListener('click', setRecordMonthAll);

  function doLogin(){
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('loginError');
    errEl.classList.add('hidden');
    if(!firebaseReady || !auth){
      errEl.textContent = '⚠️ 尚未設定 Firebase，請聯絡管理者';
      errEl.classList.remove('hidden');
      return;
    }
    if(!email || !password){
      errEl.textContent = '請輸入帳號和密碼';
      errEl.classList.remove('hidden');
      return;
    }
    auth.signInWithEmailAndPassword(email, password).catch(()=>{
      errEl.textContent = '帳號或密碼錯誤，請再試一次';
      errEl.classList.remove('hidden');
    });
  }

  document.getElementById('loginSubmitBtn').addEventListener('click', doLogin);
  document.getElementById('loginError').addEventListener('click', ()=>{});
  document.getElementById('login-password').addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ e.preventDefault(); doLogin(); }
  });
  document.getElementById('login-email').addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ e.preventDefault(); doLogin(); }
  });

  document.getElementById('logoutBtn').addEventListener('click', ()=>{
    if(auth) auth.signOut();
  });

  if(firebaseReady && auth){
    auth.onAuthStateChanged((user)=>{
      if(user){
        document.getElementById('loginOverlay').classList.add('hidden');
        document.getElementById('appRoot').classList.remove('hidden');
        document.getElementById('login-email').value = '';
        document.getElementById('login-password').value = '';
        document.getElementById('loginError').classList.add('hidden');
        loadTasks();
      } else {
        document.getElementById('loginOverlay').classList.remove('hidden');
        document.getElementById('appRoot').classList.add('hidden');
        stopLoadingTasks();
      }
    });
  } else {
    document.getElementById('loginError').textContent = '⚠️ 尚未設定 Firebase，請聯絡管理者設定 firebaseConfig';
    document.getElementById('loginError').classList.remove('hidden');
  }

  populateNoteCategorySelect();
})();
</script>
</body>
</html>
